<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Roblox Admin Panel</title>
  <style>
    body{font-family:Inter,system-ui,Arial;background:#0f1724;color:#e6eef8;padding:20px}
    .top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    input,select{padding:8px;border-radius:6px;border:1px solid #2b3440;background:#081126;color:inherit}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:8px;border-bottom:1px solid #1f2937;text-align:left}
    th{background:#0b1220}
    .btn{padding:8px 10px;border-radius:6px;border:none;cursor:pointer}
    .muted{color:#98a2b3}
  </style>
</head>
<body>
  <h2>Roblox Admin Panel — Logs</h2>
  <div class="top">
    <input id="search" placeholder="Поиск по нику или событию" />
    <select id="filter">
      <option value="">Все события</option>
      <option value="joined">joined</option>
      <option value="left">left</option>
      <option value="money">money</option>
      <option value="pickup">pickup</option>
    </select>
    <button id="refresh" class="btn">Обновить</button>
    <div style="margin-left:auto" class="muted">Logged as: <span id="who"></span> <button id="logout" class="btn">Logout</button></div>
  </div>

  <table id="table">
    <thead>
      <tr><th>Игрок</th><th>Событие</th><th>Данные</th><th>Баланс</th><th>Время</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="modal" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#071022;padding:16px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:90%;max-height:85%;overflow:auto"></div>

  <script>
    const BASE = location.origin;
    function getToken(){ return localStorage.getItem("admin_token"); }
    async function authGuard(){
      const token = getToken();
      if(!token){ location.href = "/login.html"; return false; }
      try{
        const whoElem = document.getElementById("who");
        const payload = JSON.parse(atob(token.split('.')[1]));
        whoElem.innerText = payload.username;
        return true;
      }catch(e){ localStorage.removeItem("admin_token"); location.href = "/login.html"; return false; }
    }

    async function apiFetch(path, opts = {}){
      opts.headers = opts.headers || {};
      const token = getToken();
      if(token) opts.headers["Authorization"] = "Bearer " + token;
      opts.headers["Content-Type"] = opts.headers["Content-Type"] || "application/json";
      const res = await fetch(BASE + path, opts);
      if(res.status === 401) { localStorage.removeItem("admin_token"); location.href = "/login.html"; throw "Unauthorized"; }
      return res;
    }

    const tbody = document.querySelector('#table tbody');

    async function fetchLogs(){
      const res = await apiFetch('/logs');
      const logs = await res.json();
      return logs;
    }

    function formatTime(ms){ const d = new Date(Number(ms)); return d.toLocaleString(); }

    function renderRows(logs){
      tbody.innerHTML = '';
      for(const l of logs){
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><a href="#" class="player-link">${escapeHtml(l.player)}</a></td><td>${escapeHtml(l.event)}</td><td>${escapeHtml(JSON.stringify(l.value || '-'))}</td><td>${(l.value && l.value.balance) ? l.value.balance : ''}</td><td>${formatTime(l.time)}</td>`;
        tr.querySelector('.player-link').addEventListener('click', e => { e.preventDefault(); openPlayer(l.player); });
        tbody.appendChild(tr);
      }
    }

    function escapeHtml(s){ return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":\"&#39;\"}[c])); }

    async function loadAndRender(){
      try{
        const q = document.getElementById('search').value.trim().toLowerCase();
        const type = document.getElementById('filter').value;
        let logs = await fetchLogs();
        if(type) logs = logs.filter(l => l.event === type);
        if(q) logs = logs.filter(l => (l.player && l.player.toLowerCase().includes(q)) || (l.event && l.event.toLowerCase().includes(q)) || (l.value && JSON.stringify(l.value).toLowerCase().includes(q)) );
        renderRows(logs);
      }catch(e){ console.error(e); }
    }

    async function openPlayer(name){
      const modal = document.getElementById('modal');
      modal.style.display = 'block';
      modal.innerHTML = '<h3>Загрузка...</h3>';
      const res = await apiFetch('/player/' + encodeURIComponent(name));
      const logs = await res.json();
      let html = `<h3>${escapeHtml(name)}</h3><p class="muted">Всего событий: ${logs.length}</p><ul>`;
      for(const l of logs.slice(0,100)){ html += `<li>[${formatTime(l.time)}] <b>${escapeHtml(l.event)}</b> — ${escapeHtml(JSON.stringify(l.value || '-'))}</li>`; }
      html += '</ul><button onclick="closeModal()" class="btn">Закрыть</button>';
      modal.innerHTML = html;
    }
    function closeModal(){ document.getElementById('modal').style.display='none'; }

    document.getElementById('refresh').addEventListener('click', loadAndRender);
    document.getElementById('search').addEventListener('input', () => setTimeout(loadAndRender, 200));
    document.getElementById('filter').addEventListener('change', loadAndRender);
    document.getElementById('logout').addEventListener('click', () => { localStorage.removeItem("admin_token"); location.href = "/login.html"; });

    // init
    (async () => {
      const ok = await authGuard();
      if(ok) { await loadAndRender(); setInterval(loadAndRender, 5000); }
    })();
  </script>
</body>
</html>
