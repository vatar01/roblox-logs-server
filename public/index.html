<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Roblox Logs Admin Panel</title>
    <style>
        body { font-family: Arial; padding:20px; background:#f5f5f5; }
        table { width:100%; border-collapse: collapse; margin-top:20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ccc; }
        th { background:#eee; }
        tr:hover { background:#f0f0f0; cursor:pointer; }
        .player-modal {
            position: fixed;
            padding:20px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background:white;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            display:none;
        }
        .close { cursor:pointer; float:right; font-size:20px; }
    </style>
</head>
<body>

<h2>Roblox Logs Admin Panel</h2>

<input id="search" placeholder="Поиск по игроку..." style="padding:10px; width:250px;">

<table id="logTable">
    <thead>
        <tr>
            <th>Игрок</th>
            <th>Событие</th>
            <th>Данные</th>
            <th>Время</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div class="player-modal" id="modal">
    <span class="close" onclick="modal.style.display='none'">×</span>
    <h3 id="playerName"></h3>
    <div id="playerLogs"></div>
</div>

<script>
    const BASE = window.location.origin; // Railway domain

    async function loadLogs() {
        const res = await fetch(`${BASE}/logs`);
        const logs = await res.json();

        const tbody = document.querySelector("#logTable tbody");
        tbody.innerHTML = "";

        logs.forEach(log => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${log.player}</td>
                <td>${log.event}</td>
                <td>${JSON.stringify(log.value || {})}</td>
                <td>${new Date(log.time).toLocaleString()}</td>
            `;
            tr.onclick = () => openPlayer(log.player);
            tbody.appendChild(tr);
        });
    }

    async function openPlayer(name) {
        const res = await fetch(`${BASE}/player/${name}`);
        const logs = await res.json();

        document.getElementById("playerName").innerText = name;

        let html = "";
        logs.slice(-50).reverse().forEach(l => {
            html += `
                <p><b>${l.event}</b> — ${JSON.stringify(l.value || {})}
                <br><small>${new Date(l.time).toLocaleString()}</small></p>
            `;
        });

        document.getElementById("playerLogs").innerHTML = html;
        modal.style.display = "block";
    }

    document.getElementById("search").oninput = function() {
        const text = this.value.toLowerCase();
        document.querySelectorAll("#logTable tbody tr").forEach(tr => {
            const player = tr.children[0].innerText.toLowerCase();
            tr.style.display = player.includes(text) ? "" : "none";
        });
    }

    loadLogs();
    setInterval(loadLogs, 3000);
</script>

</body>
</html>
