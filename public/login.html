<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <style>
    body{font-family:Arial;padding:30px;background:#f3f4f6}
    .box{background:#fff;padding:20px;border-radius:8px;max-width:360px;margin:40px auto;box-shadow:0 8px 30px rgba(0,0,0,.05)}
    input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:6px}
    button{padding:10px 14px;border-radius:6px;border:0;background:#2563eb;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <h3>Admin Login</h3>
    <input id="username" placeholder="Username"/>
    <input id="password" placeholder="Password" type="password"/>
    <button id="login">Login</button>
    <p id="msg" style="color:red"></p>
  </div>

  <script>
    const API_BASE = location.origin; // when served from same domain

    document.getElementById("login").onclick = async () => {
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;
      const res = await fetch(API_BASE + "/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (res.ok && data.token) {
        localStorage.setItem("admin_token", data.token);
        location.href = "/"; // redirect to main admin panel (index.html)
      } else {
        document.getElementById("msg").innerText = data.error || "Login failed";
      }
    }
  </script>
</body>
</html>
